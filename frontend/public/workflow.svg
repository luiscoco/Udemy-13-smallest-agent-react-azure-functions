<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1660" viewBox="0 0 1440 1660" role="img" aria-labelledby="title desc"><title id="title">React and Azure Functions UML workflow</title><desc id="desc">Sixteen numbered interactions with streaming loop and success, error and missing-key alternatives.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#285b98"/></marker></defs><rect width="1440" height="1660" fill="#f8fbff"/><text x="35" y="40" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="28">One prompt through a serverless C# application</text><text x="35" y="75" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="18">UML sequence diagram · POST SSE · selected application-level interactions</text><rect x="15" y="100" width="250" height="80" rx="14" fill="#edf5ff" stroke="#c3d4eb"/><text x="140" y="132" text-anchor="middle" fill="#142547" font-family="Arial,sans-serif" font-size="20">Student / Browser</text><text x="140" y="162" text-anchor="middle" fill="#142547" font-family="Arial,sans-serif" font-size="16">Prompt and result</text><line x1="140" y1="180" x2="140" y2="1615" stroke="#9baec7" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="295" y="100" width="250" height="80" rx="14" fill="#f3edff" stroke="#c3d4eb"/><text x="420" y="132" text-anchor="middle" fill="#142547" font-family="Arial,sans-serif" font-size="20">React client</text><text x="420" y="162" text-anchor="middle" fill="#142547" font-family="Arial,sans-serif" font-size="16">State and rendering</text><line x1="420" y1="180" x2="420" y2="1615" stroke="#9baec7" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="575" y="100" width="250" height="80" rx="14" fill="#eaf7f0" stroke="#c3d4eb"/><text x="700" y="132" text-anchor="middle" fill="#142547" font-family="Arial,sans-serif" font-size="20">Azure Functions</text><text x="700" y="162" text-anchor="middle" fill="#142547" font-family="Arial,sans-serif" font-size="16">.NET 10 isolated worker</text><line x1="700" y1="180" x2="700" y2="1615" stroke="#9baec7" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="855" y="100" width="250" height="80" rx="14" fill="#fff2e6" stroke="#c3d4eb"/><text x="980" y="132" text-anchor="middle" fill="#142547" font-family="Arial,sans-serif" font-size="20">C# Messages SDK</text><text x="980" y="162" text-anchor="middle" fill="#142547" font-family="Arial,sans-serif" font-size="16">Typed streaming client</text><line x1="980" y1="180" x2="980" y2="1615" stroke="#9baec7" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="1135" y="100" width="250" height="80" rx="14" fill="#edf5ff" stroke="#c3d4eb"/><text x="1260" y="132" text-anchor="middle" fill="#142547" font-family="Arial,sans-serif" font-size="20">Claude API</text><text x="1260" y="162" text-anchor="middle" fill="#142547" font-family="Arial,sans-serif" font-size="16">Model inference</text><line x1="1260" y1="180" x2="1260" y2="1615" stroke="#9baec7" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="285" y="650" width="1110" height="280" rx="8" fill="none" stroke="#9baec7" stroke-width="1.5"/><text x="300" y="675" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">loop [streamed text and application updates]</text><rect x="20" y="945" width="1380" height="645" rx="8" fill="none" stroke="#9baec7" stroke-width="1.5"/><text x="30" y="965" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">alt [complete]</text><line x1="20" y1="1290" x2="1400" y2="1290" stroke="#9baec7" stroke-width="1.5" stroke-dasharray="5 5"/><text x="30" y="1310" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">[failure]</text><line x1="20" y1="1450" x2="1400" y2="1450" stroke="#9baec7" stroke-width="1.5" stroke-dasharray="5 5"/><text x="30" y="1470" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">[missing key or invalid input]</text><text x="155" y="215" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">1. Run prompt</text><path d="M140 225 H420" fill="none" stroke="#285b98" stroke-width="2"  marker-end="url(#arrow)"/><text x="435" y="297" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">2. POST /api/agent/stream</text><path d="M420 307 H700" fill="none" stroke="#285b98" stroke-width="2"  marker-end="url(#arrow)"/><text x="710" y="379" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">3. Validate bounded JSON input</text><path d="M700 389 h65 v30 h-65" fill="none" stroke="#285b98" stroke-width="2"  marker-end="url(#arrow)"/><text x="715" y="461" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">4. Delegate HTTP trigger</text><path d="M700 471 H980" fill="none" stroke="#285b98" stroke-width="2"  marker-end="url(#arrow)"/><text x="995" y="543" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">5. Create streaming model request</text><path d="M980 553 H1260" fill="none" stroke="#285b98" stroke-width="2"  marker-end="url(#arrow)"/><text x="995" y="625" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">6. Receive SDK stream chunks</text><path d="M1260 635 H980" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="715" y="719" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">7. Project safe text delta</text><path d="M980 729 H700" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="435" y="801" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">8. Write UTF-8 SSE event</text><path d="M700 811 H420" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="430" y="883" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">9. Update React answer and timeline</text><path d="M420 893 h65 v30 h-65" fill="none" stroke="#285b98" stroke-width="2"  marker-end="url(#arrow)"/><text x="715" y="987" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">10. Aggregate result and usage</text><path d="M980 997 H700" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="430" y="1069" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">11. Dispatch final result</text><path d="M420 1079 h65 v30 h-65" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="155" y="1151" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">12. Render safe highlighted Markdown</text><path d="M420 1161 H140" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="435" y="1233" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">13. Complete final result plus done</text><path d="M700 1243 H420" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="435" y="1315" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">14. Emit safe stream error</text><path d="M700 1325 H420" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="155" y="1397" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">15. Show recoverable browser error</text><path d="M420 1407 H140" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="435" y="1479" text-anchor="start" fill="#142547" font-family="Arial,sans-serif" font-size="17">16. Reject missing key before inference</text><path d="M700 1489 H420" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/></svg>
